<!DOCTYPE html>
<html>

<head>
    <title>Companies</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="nav">

        <a href="/admin-dashboard">
            Admin Dashboard
        </a>

        <a href="/companies">
            Companies
        </a>

        <a href="/students">
            Students
        </a>

        <a href="/admin-applications">
            Applications
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

    <div class="container">

        <h1>Companies</h1>

        {% if companies %}

            {% for company in companies %}

                <div class="card">

                    <h2>{{ company[1] }}</h2>

                    <p>
                        <strong>Location:</strong>
                        {{ company[2] }}
                    </p>

                    <p>
                        <strong>Description:</strong>
                        {{ company[3] }}
                    </p>

                </div>

            {% endfor %}

        {% else %}

            <div class="card">
                <p>No companies have been added yet.</p>
            </div>

        {% endif %}

    </div>

</body>

</html>

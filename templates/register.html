<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="nav">
        <a href="/">Placement System</a>
    </div>

    <div class="form-card">

        <h1>Student Registration</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <p>Create your placement account.</p>

        <form action="/register" method="POST">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>

            <div class="form-group">

                <label>CGPA</label>

                <input
                    type="number"
                    name="cgpa"
                    step="0.01"
                    min="0"
                    max="10"
                    required
                >

            </div>

            <div class="form-group">

                <label>Branch</label>

                <input
                    type="text"
                    name="branch"
                    placeholder="e.g. ECE"
                    required
                >

            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <hr>

        <a href="/">
            Back to Login
        </a>

    </div>

</body>

</html>

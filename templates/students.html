<!DOCTYPE html>
<html>

<head>
    <title>Students</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="nav">

        <a href="/admin-dashboard">
            Admin Dashboard
        </a>

        <a href="/companies">
            Companies
        </a>

        <a href="/students">
            Students
        </a>

        <a href="/admin-applications">
            Applications
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

    <div class="container">

        <h1>Registered Students</h1>

        {% if students %}

            {% for student in students %}

                <div class="card">

                    <h2>{{ student[1] }}</h2>

                    <p>
                        <strong>Email:</strong>
                        {{ student[2] }}
                    </p>

                    <p>
                        <strong>CGPA:</strong>
                        {{ student[3] }}
                    </p>

                    <p>
                        <strong>Branch:</strong>
                        {{ student[4] }}
                    </p>

                </div>

            {% endfor %}

        {% else %}

            <div class="card">
                <p>No students registered yet.</p>
            </div>

        {% endif %}

    </div>

</body>

</html>
